{% extends 'base.html' %}
{% from '_ui.html' import cross %}
{% block title %}Erro {{ status_code }}{% endblock %}

{% block body %}
<main class="auth">
    <div class="auth-card">
        <section class="card">
            <div class="card-body">
                <span class="brand-mark">{{ cross() }}</span>
                <div>
                    <p class="eyebrow">Erro {{ status_code }}</p>
                    <h1>Não foi possível concluir</h1>
                    <p class="lead">{{ message }}</p>
                </div>
                <div class="actions">
                    <button type="button" class="btn" onclick="history.back()">Voltar</button>
                    <a href="{{ url_for('index') }}" class="btn btn-primary">Ir para o início</a>
                </div>
            </div>
        </section>
    </div>
</main>
{% endblock %}
